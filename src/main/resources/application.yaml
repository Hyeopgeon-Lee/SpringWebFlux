    url: ${DB_R2DBC_URL:r2dbc:mariadb://localhost:3306/webfluxDB}
    username: ${DB_USERNAME:poly}
    password: ${DB_PASSWORD:}
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:11000}

# 교육용 공용 사용자입니다. 실제 인증/인가 기능이 아닙니다.
app:
  demo-user-id: ${DEMO_USER_ID:USER01}

logging:
  level:
    kopo.poly: INFO
